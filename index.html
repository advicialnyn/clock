<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Timepieces</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

  :root{
    --ink:#0f1115;
    --ink-2:#161922;
    --paper:#ede8de;
    --brass:#c9a15c;
    --brass-dim:#5a4d34;
    --teal:#4c7a73;
    --grey:#6b6f76;
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
  }


  /* =====================================================
     HEADER
     ===================================================== */

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 26px 0;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--grey);
    z-index:10;
  }

  header .mark{
    color:var(--brass);
  }

  header .count{
    color:var(--paper);
    opacity:0.7;
  }


  /* =====================================================
     MENU BUTTON
     ===================================================== */

  #menuBtn{
    position:absolute;
    left:18px;
    top:18px;

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--ink);
    border:1px solid var(--brass-dim);
    border-radius:50%;

    color:var(--brass);

    font-family:inherit;
    font-size:20px;

    cursor:pointer;

    z-index:30;

    transition:
      border-color 0.2s ease,
      background 0.2s ease,
      color 0.2s ease;
  }

  #menuBtn:hover{
    border-color:var(--brass);
    color:var(--paper);
  }

  #menuBtn:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }


  /* =====================================================
     TITLE
     ===================================================== */

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px, 4vw, 34px);
    text-align:center;
    margin:2px 0 0;
    letter-spacing:0.01em;
    color:var(--paper);
    z-index:5;
  }


  /* =====================================================
     ALPHABETICAL TABS
     ===================================================== */

  #categoryTabs{
    display:flex;
    gap:8px;

    overflow-x:auto;
    white-space:nowrap;

    padding:10px 26px 4px;

    scrollbar-width:none;

    z-index:5;
  }

  #categoryTabs::-webkit-scrollbar{
    display:none;
  }

  .category-tab{
    flex:0 0 auto;

    background:none;

    border:1px solid var(--brass-dim);

    color:var(--grey);

    padding:6px 10px;

    font-family:inherit;
    font-size:10px;

    letter-spacing:0.08em;
    text-transform:uppercase;

    cursor:pointer;

    border-radius:2px;

    transition:
      color 0.2s ease,
      border-color 0.2s ease,
      background 0.2s ease;
  }

  .category-tab:hover{
    color:var(--paper);
    border-color:var(--brass);
  }

  .category-tab.active{
    color:var(--ink);
    background:var(--brass);
    border-color:var(--brass);
  }


  /* =====================================================
     VIEWPORT
     ===================================================== */

  #viewport{
    position:relative;
    flex:1;
    overflow:hidden;
    perspective:1400px;
  }

  #track{
    position:absolute;

    top:0;
    left:0;

    height:100%;

    display:flex;

    will-change:transform;

    touch-action:pan-y;
  }

  .pane{
    position:relative;

    height:100%;
    width:100vw;

    flex:0 0 100vw;

    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pane iframe{
    width:min(92vw,560px);
    height:min(72vh,560px);

    border:0;

    background:transparent;

    pointer-events:none;
  }


  /* =====================================================
     BEZEL
     ===================================================== */

  #bezel{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:14px;

    padding:10px 0 8px;

    z-index:5;
  }

  .tick{
    width:2px;
    height:14px;

    background:var(--brass-dim);

    border-radius:1px;

    transition:
      height 0.25s ease,
      background 0.25s ease,
      transform 0.25s ease;
  }

  .tick.active{
    height:22px;

    background:var(--brass);

    transform:scaleX(2);
  }


  /* =====================================================
     FOOTER
     ===================================================== */

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 26px 22px;

    font-size:10px;

    letter-spacing:0.14em;

    text-transform:uppercase;

    color:var(--grey);

    z-index:5;
  }

  footer .hint{
    transition:opacity 0.6s ease;
  }

  footer .hint.faded{
    opacity:0.25;
  }


  /* =====================================================
     NAVIGATION BUTTONS
     ===================================================== */

  .nav-btn{
    position:absolute;

    top:50%;

    transform:translateY(-50%);

    background:none;

    border:1px solid var(--brass-dim);

    color:var(--brass);

    width:38px;
    height:38px;

    border-radius:50%;

    font-family:inherit;

    font-size:16px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:6;

    opacity:0.55;

    transition:
      opacity 0.2s ease,
      border-color 0.2s ease;
  }

  .nav-btn:hover{
    opacity:1;
    border-color:var(--brass);
  }

  .nav-btn:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }

  #prevBtn{
    left:16px;
  }

  #nextBtn{
    right:16px;
  }

  @media(max-width:640px){

    .nav-btn{
      display:none;
    }

  }


  /* =====================================================
     SIDE MENU
     ===================================================== */

  #menuOverlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.55);

    opacity:0;

    visibility:hidden;

    transition:
      opacity 0.25s ease,
      visibility 0.25s ease;

    z-index:40;
  }

  #menuOverlay.open{
    opacity:1;
    visibility:visible;
  }


  #sideMenu{
    position:absolute;

    top:0;
    left:0;

    width:min(340px,88vw);
    height:100%;

    background:var(--ink-2);

    border-right:1px solid var(--brass-dim);

    transform:translateX(-100%);

    transition:transform 0.3s cubic-bezier(.22,.61,.36,1);

    display:flex;

    flex-direction:column;

    box-shadow:12px 0 40px rgba(0,0,0,0.35);
  }

  #menuOverlay.open #sideMenu{
    transform:translateX(0);
  }


  /* Menu header */

  .menu-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:22px 20px 18px;

    border-bottom:1px solid var(--brass-dim);
  }

  .menu-title{
    font-family:'Fraunces',serif;

    font-size:24px;

    color:var(--paper);
  }

  #closeMenu{
    width:40px;
    height:40px;

    border-radius:50%;

    background:none;

    border:1px solid var(--brass-dim);

    color:var(--brass);

    font-family:inherit;

    font-size:20px;

    cursor:pointer;
  }

  #closeMenu:hover{
    border-color:var(--brass);
    color:var(--paper);
  }


  /* Search */

  #clockSearch{
    margin:14px 18px;

    width:calc(100% - 36px);

    padding:11px 12px;

    background:var(--ink);

    border:1px solid var(--brass-dim);

    color:var(--paper);

    font-family:inherit;

    font-size:12px;

    outline:none;

    border-radius:2px;
  }

  #clockSearch::placeholder{
    color:var(--grey);
  }

  #clockSearch:focus{
    border-color:var(--brass);
  }


  /* Scrollable clock list */

  #clockList{
    flex:1;

    overflow-y:auto;

    padding:4px 10px 24px;

    scrollbar-width:thin;

    scrollbar-color:
      var(--brass-dim)
      transparent;
  }

  .clock-item{
    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:13px 12px;

    margin-bottom:2px;

    background:none;

    border:0;

    border-bottom:1px solid rgba(90,77,52,0.35);

    color:var(--grey);

    font-family:inherit;

    font-size:12px;

    text-align:left;

    cursor:pointer;
  }

  .clock-item:hover{
    color:var(--paper);
    background:rgba(201,161,92,0.05);
  }

  .clock-item.active{
    color:var(--brass);
  }

  .clock-number{
    opacity:0.45;

    font-size:10px;

    min-width:30px;
  }

  .clock-item-name{
    flex:1;
  }

  .clock-item.active .clock-number{
    color:var(--brass);
    opacity:1;
  }

  .no-results{
    padding:20px 12px;

    color:var(--grey);

    font-size:11px;
    text-align:center;
  }


  /* =====================================================
     REDUCED MOTION
     ===================================================== */

  @media(prefers-reduced-motion:reduce){

    #track{
      transition:none !important;
    }

    .tick{
      transition:none !important;
    }

    #menuOverlay,
    #sideMenu{
      transition:none !important;
    }

  }

</style>
</head>


<body>

<div id="app">


  <!-- ===================================================
       MENU BUTTON
       =================================================== -->

  <button
    id="menuBtn"
    type="button"
    aria-label="Open clock menu"
    aria-controls="menuOverlay"
    aria-expanded="false">

    ☰

  </button>


  <!-- ===================================================
       HEADER
       =================================================== -->

  <header>

    <span>
      <span class="mark">&#9679;</span>
      TIMEPIECES
    </span>

    <span
      class="count"
      id="count">

      01 / 02

    </span>

  </header>


  <!-- ===================================================
       TITLE
       =================================================== -->

  <h1
    class="title"
    id="title">

    Anticlockwise

  </h1>


  <!-- ===================================================
       ALPHABETICAL TABS
       =================================================== -->

  <div id="categoryTabs"></div>


  <!-- ===================================================
       CLOCK VIEWPORT
       =================================================== -->

  <div id="viewport">

    <button
      class="nav-btn"
      id="prevBtn"
      aria-label="Previous clock">

      &#8249;

    </button>


    <div id="track"></div>


    <button
      class="nav-btn"
      id="nextBtn"
      aria-label="Next clock">

      &#8250;

    </button>

  </div>


  <!-- ===================================================
       BEZEL
       =================================================== -->

  <div id="bezel"></div>


  <!-- ===================================================
       FOOTER
       =================================================== -->

  <footer>

    <span
      class="hint"
      id="hint">

      swipe, drag, or use &#8592; &#8594;

    </span>

    <span id="pathLabel">

      /clocks/anticlockwise_clock.html

    </span>

  </footer>

</div>



<!-- =====================================================
     SIDE MENU
     ===================================================== -->

<div
  id="menuOverlay"
  aria-hidden="true">

  <aside
    id="sideMenu"
    aria-label="Clock menu">


    <div class="menu-header">

      <div class="menu-title">
        Clocks
      </div>

      <button
        id="closeMenu"
        type="button"
        aria-label="Close clock menu">

        ×

      </button>

    </div>


    <input
      id="clockSearch"
      type="search"
      placeholder="Search clocks..."
      autocomplete="off"
      aria-label="Search clocks">


    <div id="clockList"></div>


  </aside>

</div>



<script>


  /* =====================================================
     FALLBACK LIST
     ===================================================== */

  const FALLBACK_CLOCKS = [

    {
      name:"Anticlockwise",
      path:"clocks/anticlockwise_clock.html"
    },

    {
      name:"Rectangular",
      path:"clocks/rectangular_clock.html"
    },

  ];


  /* =====================================================
     FILE NAME -> TITLE
     ===================================================== */

  function toTitle(filename){

    return filename

      .replace(/\.html?$/i,'')

      .replace(/[_-]+/g,' ')

      .replace(
        /\b\w/g,
        c => c.toUpperCase()
      );

  }


  /* =====================================================
     DETECT GITHUB REPOSITORY
     ===================================================== */

  function detectRepo(){

    const host =
      window.location.hostname;

    if(!host.endsWith('.github.io'))
      return null;


    const owner =
      host.replace('.github.io','');


    const parts =
      window.location.pathname
        .split('/')
        .filter(Boolean);


    const repo =
      parts.length > 0
        ? parts[0]
        : owner + '.github.io';


    return {
      owner,
      repo
    };

  }


  /* =====================================================
     DISCOVER CLOCKS
     ===================================================== */

  async function discoverClocks(){

  try{

    const response = await fetch(
      "https://api.github.com/repos/advicialnyn/clock/contents/clocks"
    );

    if(!response.ok){
      throw new Error(
        "GitHub API error: " + response.status
      );
    }

    const files = await response.json();

    const clocks = files
      .filter(file =>
        file.type === "file" &&
        file.name.toLowerCase().endsWith(".html")
      )
      .sort((a,b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          { sensitivity:"base" }
        )
      )
      .map(file => ({
        name: toTitle(file.name),
        path: "clocks/" + file.name
      }));

    console.log(
      "Found clocks:",
      clocks
    );

    return clocks;

  }catch(error){

    console.error(
      "Could not load clocks:",
      error
    );

    return FALLBACK_CLOCKS;

  }

}

  /* =====================================================
     ELEMENTS
     ===================================================== */

  const track =
    document.getElementById('track');

  const bezel =
    document.getElementById('bezel');

  const titleEl =
    document.getElementById('title');

  const countEl =
    document.getElementById('count');

  const pathLabel =
    document.getElementById('pathLabel');

  const hint =
    document.getElementById('hint');

  const prevBtn =
    document.getElementById('prevBtn');

  const nextBtn =
    document.getElementById('nextBtn');

  const categoryTabs =
    document.getElementById('categoryTabs');

  const menuBtn =
    document.getElementById('menuBtn');

  const menuOverlay =
    document.getElementById('menuOverlay');

  const closeMenu =
    document.getElementById('closeMenu');

  const clockList =
    document.getElementById('clockList');

  const clockSearch =
    document.getElementById('clockSearch');


  /* =====================================================
     STATE
     ===================================================== */

  let CLOCKS = [];

  let current = 0;

  let viewportWidth =
    window.innerWidth;

  let dragging = false;

  let dragStartX = 0;

  let dragDeltaX = 0;

  let hasInteracted = false;


  /* =====================================================
     BUILD EMPTY PANES + TABS + MENU
     ===================================================== */

  function buildPanes(){

    track.innerHTML = '';

    bezel.innerHTML = '';

    categoryTabs.innerHTML = '';

    clockList.innerHTML = '';


    CLOCKS.forEach(
      (clock,i) => {


        /* -----------------------------------------------
           EMPTY PANE
           ----------------------------------------------- */

        const pane =
          document.createElement('div');

        pane.className =
          'pane';

        pane.dataset.index =
          i;

        track.appendChild(pane);


        /* -----------------------------------------------
           BEZEL
           ----------------------------------------------- */

        const tick =
          document.createElement('div');

        tick.className =
          'tick' +
          (i === 0
            ? ' active'
            : '');

        bezel.appendChild(tick);


        /* -----------------------------------------------
           TOP TABS
           ----------------------------------------------- */

        const tab =
          document.createElement('button');

        tab.className =
          'category-tab' +
          (i === 0
            ? ' active'
            : '');

        tab.type = 'button';

        tab.textContent =
          clock.name;


        tab.addEventListener(
          'click',
          () => {

            goTo(i);

          }
        );


        categoryTabs.appendChild(tab);


        /* -----------------------------------------------
           SIDE MENU ITEM
           ----------------------------------------------- */

        const item =
          document.createElement('button');

        item.className =
          'clock-item' +
          (i === 0
            ? ' active'
            : '');

        item.type = 'button';


        const number =
          document.createElement('span');

        number.className =
          'clock-number';

        number.textContent =
          String(i + 1)
            .padStart(2,'0');


        const name =
          document.createElement('span');

        name.className =
          'clock-item-name';

        name.textContent =
          clock.name;


        item.appendChild(number);

        item.appendChild(name);


        item.dataset.index =
          i;


        item.addEventListener(
          'click',
          () => {

            goTo(i);

            closeClockMenu();

          }
        );


        clockList.appendChild(item);

      }
    );


    /*
     * Load only:
     *
     * previous
     * current
     * next
     */

    updateLoadedClocks();

  }


  /* =====================================================
     CREATE IFRAME
     ===================================================== */

  function createIframe(index){

    if(
      index < 0 ||
      index >= CLOCKS.length
    )
      return;


    const pane =
      track.children[index];


    if(!pane)
      return;


    if(
      pane.querySelector('iframe')
    )
      return;


    const clock =
      CLOCKS[index];


    const iframe =
      document.createElement('iframe');


    iframe.src =
      clock.path;


    iframe.title =
      clock.name + ' clock';


    iframe.loading =
      'eager';


    iframe.setAttribute(
      'aria-label',
      clock.name + ' clock'
    );


    pane.appendChild(iframe);

  }


  /* =====================================================
     REMOVE IFRAME
     ===================================================== */

  function removeIframe(index){

    if(
      index < 0 ||
      index >= CLOCKS.length
    )
      return;


    const pane =
      track.children[index];


    if(!pane)
      return;


    const iframe =
      pane.querySelector('iframe');


    if(iframe){

      /*
       * Destroy the iframe completely.
       * This stops its JS and releases
       * its document.
       */

      iframe.src =
        'about:blank';


      iframe.remove();

    }

  }


  /* =====================================================
     KEEP ONLY 3 CLOCKS LOADED
     ===================================================== */

  function updateLoadedClocks(){

    if(!CLOCKS.length)
      return;


    const allowed =
      new Set();


    /* Previous */

    if(current - 1 >= 0)
      allowed.add(current - 1);


    /* Current */

    allowed.add(current);


    /* Next */

    if(current + 1 < CLOCKS.length)
      allowed.add(current + 1);


    /*
     * Create allowed iframes
     * and destroy everything else.
     */

    for(
      let i = 0;
      i < CLOCKS.length;
      i++
    ){

      if(
        allowed.has(i)
      ){

        createIframe(i);

      }else{

        removeIframe(i);

      }

    }

  }


  /* =====================================================
     UPDATE UI
     ===================================================== */

  function updateChrome(){

    if(!CLOCKS[current])
      return;


    titleEl.textContent =
      CLOCKS[current].name;


    pathLabel.textContent =
      '/' +
      CLOCKS[current].path;


    countEl.textContent =
      String(current + 1)
        .padStart(2,'0') +
      ' / ' +
      String(CLOCKS.length)
        .padStart(2,'0');


    /* -----------------------------------------------
       BEZEL
       ----------------------------------------------- */

    [...bezel.children]
      .forEach(
        (tick,i) => {

          tick.classList.toggle(
            'active',
            i === current
          );

        }
      );


    /* -----------------------------------------------
       TOP TABS
       ----------------------------------------------- */

    [...categoryTabs.children]
      .forEach(
        (tab,i) => {

          tab.classList.toggle(
            'active',
            i === current
          );

        }
      );


    const activeTab =
      categoryTabs.children[current];


    if(activeTab){

      activeTab.scrollIntoView({
        behavior:'smooth',
        block:'nearest',
        inline:'center'
      });

    }


    /* -----------------------------------------------
       SIDE MENU
       ----------------------------------------------- */

    [...clockList.children]
      .forEach(
        (item,i) => {

          item.classList.toggle(
            'active',
            i === current
          );

        }
      );


    /* -----------------------------------------------
       NAV BUTTONS
       ----------------------------------------------- */

    prevBtn.style.visibility =
      current === 0
        ? 'hidden'
        : 'visible';


    nextBtn.style.visibility =
      current === CLOCKS.length - 1
        ? 'hidden'
        : 'visible';

  }


  /* =====================================================
     GO TO CLOCK
     ===================================================== */

  function goTo(
    index,
    animate = true
  ){

    current =
      Math.max(
        0,
        Math.min(
          CLOCKS.length - 1,
          index
        )
      );


    track.style.transition =
      animate
        ? 'transform 0.42s cubic-bezier(.22,.61,.36,1)'
        : 'none';


    track.style.transform =
      `translateX(${-current * viewportWidth}px)`;


    /*
     * Change the 3-clock loading window.
     */

    updateLoadedClocks();


    updateChrome();


    markInteracted();

  }


  /* =====================================================
     INTERACTION HINT
     ===================================================== */

  function markInteracted(){

    if(hasInteracted)
      return;


    hasInteracted = true;

    hint.classList.add('faded');

  }


  /* =====================================================
     RESIZE
     ===================================================== */

  window.addEventListener(
    'resize',
    () => {

      viewportWidth =
        window.innerWidth;


      goTo(
        current,
        false
      );

    }
  );


  /* =====================================================
     PREVIOUS / NEXT
     ===================================================== */

  prevBtn.addEventListener(
    'click',
    () => {

      goTo(
        current - 1
      );

    }
  );


  nextBtn.addEventListener(
    'click',
    () => {

      goTo(
        current + 1
      );

    }
  );


  /* =====================================================
     KEYBOARD
     ===================================================== */

  window.addEventListener(
    'keydown',
    e => {

      /*
       * Don't change clocks while typing
       * in the menu search box.
       */

      if(
        document.activeElement ===
        clockSearch
      )
        return;


      if(
        e.key === 'ArrowRight'
      ){

        goTo(
          current + 1
        );

      }


      if(
        e.key === 'ArrowLeft'
      ){

        goTo(
          current - 1
        );

      }


      if(
        e.key === 'Escape'
      ){

        closeClockMenu();

      }

    }
  );


  /* =====================================================
     TOUCH SWIPE
     ===================================================== */

  const viewportEl =
    document.getElementById('viewport');


  function onStart(x){

    dragging = true;

    dragStartX = x;

    dragDeltaX = 0;

    track.style.transition =
      'none';

    markInteracted();

  }


  function onMove(x){

    if(!dragging)
      return;


    dragDeltaX =
      x - dragStartX;


    let resist = 1;


    if(
      (current === 0 &&
       dragDeltaX > 0) ||

      (current === CLOCKS.length - 1 &&
       dragDeltaX < 0)
    ){

      resist = 0.35;

    }


    const offset =
      -current * viewportWidth +
      dragDeltaX * resist;


    track.style.transform =
      `translateX(${offset}px)`;

  }


  function onEnd(){

    if(!dragging)
      return;


    dragging = false;


    const threshold =
      viewportWidth * 0.16;


    if(
      dragDeltaX <= -threshold
    ){

      goTo(
        current + 1
      );

    }

    else if(
      dragDeltaX >= threshold
    ){

      goTo(
        current - 1
      );

    }

    else{

      goTo(
        current
      );

    }

  }


  viewportEl.addEventListener(
    'touchstart',
    e => {

      onStart(
        e.touches[0].clientX
      );

    },
    {
      passive:true
    }
  );


  viewportEl.addEventListener(
    'touchmove',
    e => {

      onMove(
        e.touches[0].clientX
      );

    },
    {
      passive:true
    }
  );


  viewportEl.addEventListener(
    'touchend',
    onEnd
  );


  /* =====================================================
     MOUSE DRAG
     ===================================================== */

  let mouseDown = false;


  viewportEl.addEventListener(
    'mousedown',
    e => {

      mouseDown = true;

      onStart(
        e.clientX
      );

    }
  );


  window.addEventListener(
    'mousemove',
    e => {

      if(mouseDown){

        onMove(
          e.clientX
        );

      }

    }
  );


  window.addEventListener(
    'mouseup',
    () => {

      if(mouseDown){

        mouseDown = false;

        onEnd();

      }

    }
  );


  /* =====================================================
     OPEN MENU
     ===================================================== */

  function openClockMenu(){

    menuOverlay.classList.add(
      'open'
    );

    menuOverlay.setAttribute(
      'aria-hidden',
      'false'
    );

    menuBtn.setAttribute(
      'aria-expanded',
      'true'
    );

    /*
     * Scroll current clock into view.
     */

    const activeItem =
      clockList.children[current];


    if(activeItem){

      activeItem.scrollIntoView({
        block:'center'
      });

    }

  }


  /* =====================================================
     CLOSE MENU
     ===================================================== */

  function closeClockMenu(){

    menuOverlay.classList.remove(
      'open'
    );

    menuOverlay.setAttribute(
      'aria-hidden',
      'true'
    );

    menuBtn.setAttribute(
      'aria-expanded',
      'false'
    );

  }


  menuBtn.addEventListener(
    'click',
    openClockMenu
  );


  closeMenu.addEventListener(
    'click',
    closeClockMenu
  );


  /*
   * Tap outside the side menu
   * to close it.
   */

  menuOverlay.addEventListener(
    'click',
    e => {

      if(
        e.target === menuOverlay
      ){

        closeClockMenu();

      }

    }
  );


  /* =====================================================
     SEARCH CLOCKS
     ===================================================== */

  clockSearch.addEventListener(
    'input',
    () => {

      const query =
        clockSearch.value
          .trim()
          .toLowerCase();


      let visible = 0;


      [...clockList.children]
        .forEach(
          item => {

            const name =
              item
                .querySelector(
                  '.clock-item-name'
                )
                .textContent
                .toLowerCase();


            const match =
              !query ||
              name.includes(query);


            item.style.display =
              match
                ? 'flex'
                : 'none';


            if(match)
              visible++;

          }
        );


      let noResults =
        clockList.querySelector(
          '.no-results'
        );


      if(
        visible === 0
      ){

        if(!noResults){

          noResults =
            document.createElement(
              'div'
            );

          noResults.className =
            'no-results';

          noResults.textContent =
            'No clocks found.';

          clockList.appendChild(
            noResults
          );

        }

      }else{

        if(noResults)
          noResults.remove();

      }

    }
  );


  /* =====================================================
     INITIALIZE
     ===================================================== */

  (async function init(){

    CLOCKS =
      await discoverClocks();


    /*
     * Always keep clocks alphabetically ordered.
     */

    CLOCKS.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          {
            sensitivity:'base'
          }
        )
    );


    buildPanes();


    goTo(
      0,
      false
    );

  })();

</script>

</body>
