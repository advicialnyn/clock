<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --face:#161922;
    --rim:#e0b975;
    --paper:#f5f2ea;
    --teal:#6fa89f;
    --dim:#8a795a;
  }
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
  }
  .panel{
    display:flex; align-items:flex-end; gap:22px;
  }
  .bitlabels{
    display:flex; flex-direction:column-reverse;
    gap:10px;
    margin-right:4px;
    padding-bottom:26px;
  }
  .bitlabels span{
    font-size:9px; color:var(--dim); letter-spacing:0.05em;
    height:18px; display:flex; align-items:center;
  }
  .group{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cols{ display:flex; gap:8px; }
  .col{ display:flex; flex-direction:column-reverse; gap:10px; }
  .dot{
    width:18px; height:18px;
    border-radius:50%;
    border:1.5px solid var(--rim);
    background:transparent;
    box-sizing:border-box;
  }
  .dot.lit{
    background:var(--rim);
  }
  .group.minute .dot.lit{ background:var(--paper); border-color:var(--paper); }
  .group.second .dot.lit{ background:var(--teal); border-color:var(--teal); }
  .glabel{
    font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--dim);
  }
  .sep{
    width:1px; align-self:stretch;
    background:var(--dim);
    opacity:0.4;
    margin-bottom:26px;
  }
  #tag{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="panel">
    <div class="bitlabels">
      <span>1</span><span>2</span><span>4</span><span>8</span>
    </div>

    <div class="group hour">
      <div class="cols" id="hourCols"></div>
      <div class="glabel">H</div>
    </div>

    <div class="sep"></div>

    <div class="group minute">
      <div class="cols" id="minuteCols"></div>
      <div class="glabel">M</div>
    </div>

    <div class="sep"></div>

    <div class="group second">
      <div class="cols" id="secondCols"></div>
      <div class="glabel">S</div>
    </div>
  </div>
  <div id="tag">binary, not roman</div>
</div>
<script>
  const BITS = [8, 4, 2, 1];

  function buildColumn(){
    const col = document.createElement('div');
    col.className = 'col';
    BITS.forEach(bit => {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.dataset.bit = bit;
      col.appendChild(dot);
    });
    return col;
  }

  function buildGroup(containerId){
    const container = document.getElementById(containerId);
    const tens = buildColumn();
    const ones = buildColumn();
    container.appendChild(tens);
    container.appendChild(ones);
    return { tens, ones };
  }

  const hourCols = buildGroup('hourCols');
  const minuteCols = buildGroup('minuteCols');
  const secondCols = buildGroup('secondCols');

  function setColumn(col, digit){
    [...col.children].forEach(dot => {
      const bit = Number(dot.dataset.bit);
      dot.classList.toggle('lit', (digit & bit) !== 0);
    });
  }

  function render(){
    const now = new Date();
    let h = now.getHours() % 12;
    if (h === 0) h = 12;
    const m = now.getMinutes();
    const s = now.getSeconds();

    setColumn(hourCols.tens, Math.floor(h / 10));
    setColumn(hourCols.ones, h % 10);
    setColumn(minuteCols.tens, Math.floor(m / 10));
    setColumn(minuteCols.ones, m % 10);
    setColumn(secondCols.tens, Math.floor(s / 10));
    setColumn(secondCols.ones, s % 10);
  }

  render();
  setInterval(render, 1000);
</script>
</body>
  </html>
