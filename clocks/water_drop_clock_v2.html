<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Drop Clock v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
  }
  canvas{ max-width:92%; max-height:78%; }
  #readout{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #time{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px, 5vw, 30px);
    color:#ede8de;
  }
  #caption{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
    text-align:center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="wc" width="760" height="560"></canvas>
  <div id="readout">
    <div id="time">00:00:00</div>
    <div id="caption">hour fills the day, minute fills the hour, second fills the minute</div>
  </div>
</div>
<script>
  const canvas = document.getElementById('wc');
  const ctx = canvas.getContext('2d');
  const W = 760, H = 560;

  const GLASS_W = 110;
  const GAP = 60;
  const GLASS_TOP = 170;
  const GLASS_BOTTOM = 500;
  const RADIUS = 14;
  const SPOUT_Y = 46;

  const totalSpan = GLASS_W * 3 + GAP * 2;
  const startX = (W - totalSpan) / 2;

  const CONTAINERS = [
    {
      key: 'H', label: 'HOUR', unitMax: 24, tickEvery: 3,
      left: startX,
      getFraction: (h, m, s, ms) => (h * 3600 + m * 60 + s + ms / 1000) / 86400,
      getUnit: (h) => h,
    },
    {
      key: 'M', label: 'MINUTE', unitMax: 60, tickEvery: 15,
      left: startX + GLASS_W + GAP,
      getFraction: (h, m, s, ms) => (m * 60 + s + ms / 1000) / 3600,
      getUnit: (h, m) => m,
    },
    {
      key: 'S', label: 'SECOND', unitMax: 60, tickEvery: 15,
      left: startX + (GLASS_W + GAP) * 2,
      getFraction: (h, m, s, ms) => (s + ms / 1000) / 60,
      getUnit: (h, m, s) => s,
    },
  ];

  CONTAINERS.forEach(c => {
    c.right = c.left + GLASS_W;
    c.spoutX = c.left + GLASS_W / 2;
    c.lastUnit = -1;
    c.dropStart = -Infinity;
    c.ripples = [];
    c.bubbles = [];
    for (let i = 0; i < 4; i++){
      c.bubbles.push({
        x: c.left + 12 + Math.random() * (GLASS_W - 24),
        speed: 14 + Math.random() * 18,
        offset: Math.random(),
        size: 1.3 + Math.random() * 1.6,
      });
    }
  });

  const DROP_DURATION = 620;

  function glassPath(c){
    ctx.beginPath();
    ctx.moveTo(c.left, GLASS_TOP);
    ctx.lineTo(c.left, GLASS_BOTTOM - RADIUS);
    ctx.quadraticCurveTo(c.left, GLASS_BOTTOM, c.left + RADIUS, GLASS_BOTTOM);
    ctx.lineTo(c.right - RADIUS, GLASS_BOTTOM);
    ctx.quadraticCurveTo(c.right, GLASS_BOTTOM, c.right, GLASS_BOTTOM - RADIUS);
    ctx.lineTo(c.right, GLASS_TOP);
  }

  function drawSpout(c){
    ctx.fillStyle = '#1a2434';
    ctx.fillRect(c.spoutX - 22, 14, 44, 12);
    ctx.strokeStyle = '#c9a15c';
    ctx.lineWidth = 2;
    ctx.strokeRect(c.spoutX - 22, 14, 44, 12);

    ctx.beginPath();
    ctx.moveTo(c.spoutX, 26);
    ctx.lineTo(c.spoutX, 36);
    ctx.strokeStyle = '#c9a15c';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(c.spoutX - 5, 36);
    ctx.lineTo(c.spoutX + 5, 36);
    ctx.lineTo(c.spoutX + 2.5, 42);
    ctx.lineTo(c.spoutX - 2.5, 42);
    ctx.closePath();
    ctx.fillStyle = '#c9a15c';
    ctx.fill();
  }

  function drawWater(c, fraction, tNow){
    const innerH = GLASS_BOTTOM - GLASS_TOP - 6;
    const level = fraction * innerH;
    const surfaceY = GLASS_BOTTOM - 3 - level;
    const waveAmp = 1.8;

    ctx.save();
    glassPath(c);
    ctx.closePath();
    ctx.clip();

    ctx.beginPath();
    ctx.moveTo(c.left, GLASS_BOTTOM + 4);
    ctx.lineTo(c.left, surfaceY);
    for (let px = c.left; px <= c.right; px += 6){
      const wy = surfaceY + Math.sin((px / 16) + tNow / 260) * waveAmp;
      ctx.lineTo(px, wy);
    }
    ctx.lineTo(c.right, GLASS_BOTTOM + 4);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, surfaceY, 0, GLASS_BOTTOM);
    grad.addColorStop(0, '#2f8a92');
    grad.addColorStop(1, '#1c5b66');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    for (let px = c.left; px <= c.right; px += 6){
      const wy = surfaceY + Math.sin((px / 16) + tNow / 260) * waveAmp;
      px === c.left ? ctx.moveTo(px, wy) : ctx.lineTo(px, wy);
    }
    ctx.strokeStyle = 'rgba(127,217,209,0.6)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    c.bubbles.forEach(b => {
      if (surfaceY >= GLASS_BOTTOM - 4) return;
      const cyclePos = ((tNow / 1000) * b.speed / 60 + b.offset) % 1;
      const by = GLASS_BOTTOM - cyclePos * (GLASS_BOTTOM - surfaceY - 6);
      if (by < surfaceY) return;
      ctx.beginPath();
      ctx.arc(b.x, by, b.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(237,232,222,0.22)';
      ctx.fill();
    });

    ctx.restore();
    return surfaceY;
  }

  function drawGlassOutline(c, surfaceY){
    glassPath(c);
    ctx.strokeStyle = 'rgba(127,184,201,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const innerH = GLASS_BOTTOM - GLASS_TOP - 6;
    for (let u = 0; u <= c.unitMax; u += c.tickEvery){
      const y = GLASS_BOTTOM - 3 - (u / c.unitMax) * innerH;
      const isMajor = u % (c.tickEvery * 2) === 0 || u === 0 || u === c.unitMax;
      ctx.beginPath();
      ctx.moveTo(c.left, y);
      ctx.lineTo(c.left + (isMajor ? 12 : 7), y);
      ctx.strokeStyle = isMajor ? 'rgba(201,161,92,0.7)' : 'rgba(127,184,201,0.3)';
      ctx.lineWidth = isMajor ? 2 : 1;
      ctx.stroke();
    }
  }

  function drawDrop(c, surfaceY, tNow){
    const progress = (tNow - c.dropStart) / DROP_DURATION;
    if (progress < 0 || progress > 1) return;
    const ease = progress * progress;
    const y = 42 + ease * (surfaceY - 42);
    ctx.beginPath();
    ctx.ellipse(c.spoutX, y, 3, 4.5 + ease * 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#7fd9d1';
    ctx.fill();
  }

  function updateRipples(c, surfaceY, tNow, currentUnit){
    if (currentUnit !== c.lastUnit){
      c.lastUnit = currentUnit;
      c.dropStart = tNow;
      c.ripples.push({ start: tNow + DROP_DURATION, y: surfaceY });
    }
    for (let i = c.ripples.length - 1; i >= 0; i--){
      const r = c.ripples[i];
      const age = tNow - r.start;
      if (age < 0) continue;
      if (age > 380){ c.ripples.splice(i, 1); continue; }
      const p = age / 380;
      const rw = 5 + p * 22;
      ctx.beginPath();
      ctx.ellipse(c.spoutX, r.y, rw, rw * 0.28, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(127,217,209,${0.5 * (1 - p)})`;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
  }

  function drawLabel(c){
    ctx.font = "500 12px 'IBM Plex Mono', monospace";
    ctx.fillStyle = '#c9a15c';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.label, c.spoutX, GLASS_BOTTOM + 26);
  }

  function tick(tNow){
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    ctx.clearRect(0, 0, W, H);

    CONTAINERS.forEach(c => {
      const fraction = c.getFraction(h, m, s, ms);
      const currentUnit = c.getUnit(h, m, s);
      drawSpout(c);
      const surfaceY = drawWater(c, fraction, tNow);
      drawGlassOutline(c, surfaceY);
      updateRipples(c, surfaceY, tNow, currentUnit);
      drawDrop(c, surfaceY, tNow);
      drawLabel(c);
    });

    const pad = n => String(n).padStart(2, '0');
    document.getElementById('time').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>
</body>
</html>
