<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="label">no hands, three bodies in orbit</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600;
  const R = SIZE / 2;

  const COL = {
    face: '#161922',
    rim: '#c9a15c',
    rimDim: '#5a4d34',
    paper: '#ede8de',
    teal: '#4c7a73',
  };

  const ORBITS = {
    hour:   R - 210,
    minute: R - 130,
    second: R - 60,
  };

  let secondTrail = [];

  function drawFace(){
    ctx.clearRect(0,0,SIZE,SIZE);

    // outer bezel
    ctx.beginPath();
    ctx.arc(R, R, R - 6, 0, Math.PI * 2);
    ctx.strokeStyle = COL.rim;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(R, R, R - 14, 0, Math.PI * 2);
    ctx.fillStyle = COL.face;
    ctx.fill();

    // orbit guide rings
    [ORBITS.hour, ORBITS.minute, ORBITS.second].forEach(radius => {
      ctx.beginPath();
      ctx.setLineDash([2, 8]);
      ctx.arc(R, R, radius, 0, Math.PI * 2);
      ctx.strokeStyle = COL.rimDim;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
    });

    // 12 hour marks on the outer ring
    for (let h = 0; h < 12; h++){
      const angle = (h / 12) * Math.PI * 2 - Math.PI / 2;
      const outer = R - 26;
      const inner = R - 40;
      ctx.beginPath();
      ctx.moveTo(R + inner * Math.cos(angle), R + inner * Math.sin(angle));
      ctx.lineTo(R + outer * Math.cos(angle), R + outer * Math.sin(angle));
      ctx.strokeStyle = COL.rim;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // center pin
    ctx.beginPath();
    ctx.arc(R, R, 6, 0, Math.PI * 2);
    ctx.fillStyle = COL.rim;
    ctx.fill();
  }

  function orbitPoint(fraction, radius){
    const angle = fraction * Math.PI * 2 - Math.PI / 2;
    return { x: R + radius * Math.cos(angle), y: R + radius * Math.sin(angle) };
  }

  function drawBody(point, radius, color, glow){
    if (glow){
      ctx.beginPath();
      ctx.arc(point.x, point.y, radius * 2.2, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius * 2.2);
      g.addColorStop(0, color + '55');
      g.addColorStop(1, color + '00');
      ctx.fillStyle = g;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    drawFace();

    const hourPoint = orbitPoint(h / 12, ORBITS.hour);
    const minutePoint = orbitPoint(m / 60, ORBITS.minute);
    const secondPoint = orbitPoint(s / 60, ORBITS.second);

    // fading comet trail behind the second body
    secondTrail.unshift(secondPoint);
    if (secondTrail.length > 18) secondTrail.pop();
    secondTrail.forEach((p, i) => {
      const alpha = 1 - i / secondTrail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5 * alpha, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(76, 122, 115, ${alpha * 0.5})`;
      ctx.fill();
    });

    // faint connecting spokes from center, like orbital radii markers
    [hourPoint, minutePoint, secondPoint].forEach(p => {
      ctx.beginPath();
      ctx.moveTo(R, R);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = 'rgba(237, 232, 222, 0.06)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    drawBody(hourPoint, 9, COL.paper, true);
    drawBody(minutePoint, 7, COL.paper, true);
    drawBody(secondPoint, 5, COL.teal, true);

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
