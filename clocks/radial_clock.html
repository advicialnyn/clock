<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radial Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #center{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    pointer-events:none;
  }
  #centerTime{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(26px, 6vw, 40px);
    color:#ede8de;
    letter-spacing:0.02em;
  }
  #centerDate{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="center">
    <div id="centerTime">00:00</div>
    <div id="centerDate">HOUR &middot; MINUTE &middot; SECOND</div>
  </div>
  <div id="label">three rings, filling instead of hands</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600;
  const R = SIZE / 2;
  const centerTimeEl = document.getElementById('centerTime');

  const COL = {
    rim: '#c9a15c',
    rimDim: '#5a4d34',
    track: 'rgba(237,232,222,0.08)',
    paper: '#ede8de',
    teal: '#4c7a73',
  };

  const RINGS = [
    { radius: R - 40,  width: 14, color: COL.rim,   label: 'H' }, // hour, 12h cycle
    { radius: R - 82,  width: 14, color: COL.paper, label: 'M' }, // minute
    { radius: R - 124, width: 14, color: COL.teal,  label: 'S' }, // second
  ];

  const START_ANGLE = -Math.PI / 2; // 12 o'clock

  function drawTrack(ring){
    ctx.beginPath();
    ctx.arc(R, R, ring.radius, 0, Math.PI * 2);
    ctx.strokeStyle = COL.track;
    ctx.lineWidth = ring.width;
    ctx.stroke();
  }

  function drawProgress(ring, fraction){
    if (fraction <= 0) return;
    ctx.beginPath();
    ctx.arc(R, R, ring.radius, START_ANGLE, START_ANGLE + fraction * Math.PI * 2);
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = ring.width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // a small bright dot at the current tip, like a progress-ring handle
    const angle = START_ANGLE + fraction * Math.PI * 2;
    const x = R + ring.radius * Math.cos(angle);
    const y = R + ring.radius * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, ring.width * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = ring.color;
    ctx.fill();
  }

  function drawTicks(){
    // faint 12-mark guide just outside the outer ring
    for (let i = 0; i < 12; i++){
      const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const inner = R - 16;
      const outer = R - 6;
      ctx.beginPath();
      ctx.moveTo(R + inner * Math.cos(angle), R + inner * Math.sin(angle));
      ctx.lineTo(R + outer * Math.cos(angle), R + outer * Math.sin(angle));
      ctx.strokeStyle = COL.rimDim;
      ctx.lineWidth = i % 3 === 0 ? 2.5 : 1.5;
      ctx.stroke();
    }
  }

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    ctx.clearRect(0, 0, SIZE, SIZE);
    drawTicks();
    RINGS.forEach(drawTrack);

    drawProgress(RINGS[0], h / 12);
    drawProgress(RINGS[1], m / 60);
    drawProgress(RINGS[2], s / 60);

    const pad = n => String(n).padStart(2, '0');
    centerTimeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
