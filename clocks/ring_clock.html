<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #readout{
    position:absolute;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(20px, 5vw, 34px);
    color:#f5f2ea;
    letter-spacing:0.04em;
  }
  #readout span.sep{ color:#e0b975; }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#8a795a;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="readout">--<span class="sep">:</span>--<span class="sep">:</span>--</div>
  <div id="label">time as three closing loops</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const readout = document.getElementById('readout');
  const SIZE = 600;
  const CX = SIZE / 2, CY = SIZE / 2;

  const COL = {
    face: '#161922',
    track: '#2a2f3b',
    rim: '#e0b975',
    paper: '#f5f2ea',
    teal: '#6fa89f',
  };

  const RINGS = {
    hour:   { r: 250, width: 16, color: COL.rim },
    minute: { r: 210, width: 16, color: COL.paper },
    second: { r: 170, width: 16, color: COL.teal },
  };

  const START = -Math.PI / 2; // 12 o'clock

  function drawFace(){
    ctx.clearRect(0, 0, SIZE, SIZE);

    ctx.beginPath();
    ctx.arc(CX, CY, RINGS.hour.r + RINGS.hour.width, 0, Math.PI * 2);
    ctx.fillStyle = COL.face;
    ctx.fill();

    ctx.save();
    ctx.translate(CX, CY);
    ctx.restore();
  }

  function drawTrack(ring){
    ctx.save();
    ctx.translate(CX, CY);
    ctx.beginPath();
    ctx.arc(0, 0, ring.r, 0, Math.PI * 2);
    ctx.strokeStyle = COL.track;
    ctx.lineWidth = ring.width;
    ctx.stroke();
    ctx.restore();
  }

  function drawProgress(ring, fraction){
    ctx.save();
    ctx.translate(CX, CY);
    ctx.beginPath();
    ctx.arc(0, 0, ring.r, START, START + fraction * Math.PI * 2);
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = ring.width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // small marker dot at the leading edge for legibility
    const a = START + fraction * Math.PI * 2;
    const x = ring.r * Math.cos(a);
    const y = ring.r * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, ring.width / 2 + 2, 0, Math.PI * 2);
    ctx.fillStyle = ring.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = COL.face;
    ctx.stroke();

    ctx.restore();
  }

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const hourFrac   = (h + m / 60) / 12;
    const minuteFrac = (m + s / 60) / 60;
    const secondFrac = (s + ms / 1000) / 60;

    drawFace();
    drawTrack(RINGS.hour);
    drawTrack(RINGS.minute);
    drawTrack(RINGS.second);

    drawProgress(RINGS.hour, hourFrac);
    drawProgress(RINGS.minute, minuteFrac);
    drawProgress(RINGS.second, secondFrac);

    const displayHour = now.getHours() % 12 === 0 ? 12 : now.getHours() % 12;
    readout.innerHTML = `${pad(displayHour)}<span class="sep">:</span>${pad(m)}<span class="sep">:</span>${pad(s)}`;

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
