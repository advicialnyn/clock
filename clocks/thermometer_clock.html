<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermometer Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
  }
  canvas{ max-width:70%; max-height:80%; }
  #readout{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #time{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px, 5vw, 30px);
    color:#ede8de;
  }
  #caption{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
    text-align:center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="tc" width="220" height="560"></canvas>
  <div id="readout">
    <div id="time">00:00:00</div>
    <div id="caption">a color that shifts with the day</div>
  </div>
</div>
<script>
  const canvas = document.getElementById('tc');
  const ctx = canvas.getContext('2d');
  const W = 220, H = 560;

  const TUBE_TOP = 40;
  const TUBE_BOTTOM = 440;
  const TUBE_CX = W / 2;
  const TUBE_HALF_W = 16;
  const BULB_CY = 480;
  const BULB_R = 42;

  function colorForHourFraction(f){
    // blue at midnight, warm at noon, back to blue by the next midnight
    const hue = 220 - 200 * Math.sin(Math.PI * f);
    return { hue, css: `hsl(${hue}, 68%, 56%)`, glow: `hsl(${hue}, 80%, 62%)` };
  }

  function tubePath(){
    ctx.beginPath();
    ctx.moveTo(TUBE_CX - TUBE_HALF_W, TUBE_TOP);
    ctx.lineTo(TUBE_CX - TUBE_HALF_W, TUBE_BOTTOM);
    ctx.arc(TUBE_CX, TUBE_BOTTOM, TUBE_HALF_W, Math.PI, 0, true);
    ctx.lineTo(TUBE_CX + TUBE_HALF_W, TUBE_TOP);
  }

  function drawGlass(){
    // bulb glass outline
    ctx.beginPath();
    ctx.arc(TUBE_CX, BULB_CY, BULB_R + 6, 0, Math.PI * 2);
    ctx.strokeStyle = '#c9a15c';
    ctx.lineWidth = 3;
    ctx.stroke();

    // tube glass outline
    tubePath();
    ctx.lineTo(TUBE_CX + TUBE_HALF_W, TUBE_TOP);
    ctx.strokeStyle = '#c9a15c';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(TUBE_CX, TUBE_TOP - 6, TUBE_HALF_W, 0, Math.PI * 2);
    ctx.strokeStyle = '#c9a15c';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawGradations(){
    for (let hr = 0; hr <= 24; hr++){
      const y = TUBE_BOTTOM - (hr / 24) * (TUBE_BOTTOM - TUBE_TOP);
      const isMajor = hr % 3 === 0;
      const len = isMajor ? 16 : 9;
      ctx.beginPath();
      ctx.moveTo(TUBE_CX + TUBE_HALF_W + 4, y);
      ctx.lineTo(TUBE_CX + TUBE_HALF_W + 4 + len, y);
      ctx.strokeStyle = isMajor ? 'rgba(201,161,92,0.75)' : 'rgba(237,232,222,0.25)';
      ctx.lineWidth = isMajor ? 2 : 1;
      ctx.stroke();

      if (isMajor){
        ctx.font = "500 11px 'IBM Plex Mono', monospace";
        ctx.fillStyle = 'rgba(201,161,92,0.85)';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(hr).padStart(2, '0'), TUBE_CX + TUBE_HALF_W + 24, y);
      }
    }
  }

  function drawMercury(hourFraction, color, tNow){
    const columnTop = TUBE_BOTTOM - hourFraction * (TUBE_BOTTOM - TUBE_TOP);
    const wobble = Math.sin(tNow / 500) * 1.2;

    ctx.save();
    tubePath();
    ctx.lineTo(TUBE_CX + TUBE_HALF_W, TUBE_TOP);
    ctx.closePath();
    ctx.clip();

    ctx.fillStyle = color.css;
    ctx.fillRect(TUBE_CX - TUBE_HALF_W, columnTop + wobble, TUBE_HALF_W * 2, TUBE_BOTTOM - columnTop + 20);

    // meniscus highlight
    ctx.beginPath();
    ctx.ellipse(TUBE_CX, columnTop + wobble, TUBE_HALF_W, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();

    ctx.restore();

    // bulb, always full, glowing with the current color
    ctx.beginPath();
    ctx.arc(TUBE_CX, BULB_CY, BULB_R, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(TUBE_CX - 12, BULB_CY - 12, 4, TUBE_CX, BULB_CY, BULB_R + 10);
    g.addColorStop(0, color.glow);
    g.addColorStop(1, color.css);
    ctx.fillStyle = g;
    ctx.fill();
  }

  function tick(tNow){
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const hourFraction = (h * 3600 + m * 60 + s) / 86400;
    const color = colorForHourFraction(hourFraction);

    ctx.clearRect(0, 0, W, H);
    drawMercury(hourFraction, color, tNow);
    drawGlass();
    drawGradations();

    const pad = n => String(n).padStart(2, '0');
    document.getElementById('time').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>
</body>
</html>
