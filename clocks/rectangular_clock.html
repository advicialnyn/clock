<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectangular Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="label">hands point at the box, not the circle</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600;
  const CX = SIZE / 2, CY = SIZE / 2;

  // the rectangle every hand and numeral is bound to
  const RECT = { w: 420, h: 300 };
  const HALF_W = RECT.w / 2, HALF_H = RECT.h / 2;

  const COL = {
    face: '#161922',
    rim: '#c9a15c',
    rimDim: '#5a4d34',
    paper: '#ede8de',
    teal: '#4c7a73',
  };

  // find where a ray from the center at `angle` (0 = up, clockwise) hits the rectangle border
  function pointOnRect(angle, w, h){
    const dx = Math.sin(angle);
    const dy = -Math.cos(angle);
    const halfW = w / 2, halfH = h / 2;
    let t = Infinity;
    if (dx !== 0){
      t = Math.min(t, Math.abs(halfW / dx));
    }
    if (dy !== 0){
      t = Math.min(t, Math.abs(halfH / dy));
    }
    return { x: dx * t, y: dy * t };
  }

  function drawFace(){
    ctx.clearRect(0,0,SIZE,SIZE);

    ctx.save();
    ctx.translate(CX, CY);

    // outer bezel rectangle
    ctx.strokeStyle = COL.rim;
    ctx.lineWidth = 3;
    ctx.strokeRect(-HALF_W - 40, -HALF_H - 40, RECT.w + 80, RECT.h + 80);

    ctx.fillStyle = COL.face;
    ctx.fillRect(-HALF_W - 32, -HALF_H - 32, RECT.w + 64, RECT.h + 64);

    // minute ticks around the rectangle perimeter
    for (let i = 0; i < 60; i++){
      const angle = (i / 60) * Math.PI * 2;
      const isHour = i % 5 === 0;
      const p = pointOnRect(angle, RECT.w + (isHour ? 20 : 12), RECT.h + (isHour ? 20 : 12));
      const p2 = pointOnRect(angle, RECT.w - (isHour ? 8 : 4), RECT.h - (isHour ? 8 : 4));
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = isHour ? COL.rim : COL.rimDim;
      ctx.lineWidth = isHour ? 3 : 1.5;
      ctx.stroke();
    }

    // numerals sit on the rectangle border itself
    ctx.font = '600 26px IBM Plex Mono, monospace';
    ctx.fillStyle = COL.paper;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let h = 1; h <= 12; h++){
      const angle = (h / 12) * Math.PI * 2;
      const p = pointOnRect(angle, RECT.w - 44, RECT.h - 40);
      ctx.fillText(String(h), p.x, p.y);
    }

    // center pin
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fillStyle = COL.rim;
    ctx.fill();

    ctx.restore();
  }

  // hands travel the same angle as a normal clock, but their tip is pulled
  // toward the rectangle border, scaled by how "confident" the hand is (fraction)
  function drawHand(angle, fraction, width, color){
    const p = pointOnRect(angle, RECT.w, RECT.h);
    const x = p.x * fraction;
    const y = p.y * fraction;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.beginPath();
    ctx.moveTo(-x * 0.12, -y * 0.12);
    ctx.lineTo(x, y);
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.stroke();
    ctx.restore();
  }

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    drawFace();

    const secAngle  = (s / 60) * Math.PI * 2;
    const minAngle  = (m / 60) * Math.PI * 2;
    const hourAngle = (h / 12) * Math.PI * 2;

    drawHand(hourAngle, 0.55, 7, COL.paper);
    drawHand(minAngle, 0.82, 5, COL.paper);
    drawHand(secAngle, 0.96, 2, COL.teal);

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
