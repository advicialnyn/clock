<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f2ea;
    --rim:#e0b975;
    --dim:#8a795a;
  }
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
  }
  #face{
    font-size:clamp(70px, 22vw, 150px);
    line-height:1;
  }
  #readout{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(16px, 3.6vw, 24px);
    color:var(--paper);
    letter-spacing:0.02em;
  }
  #readout .sep{ color:var(--rim); }
  #tag{
    position:absolute;
    bottom:4%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="face">🕛</div>
  <div id="readout">00<span class="sep">:</span>00<span class="sep">:</span>00</div>
  <div id="tag">the emoji doesn't know seconds</div>
</div>
<script>
  const CLOCK_EMOJI = [
    '\u{1F550}','\u{1F551}','\u{1F552}','\u{1F553}','\u{1F554}','\u{1F555}',
    '\u{1F556}','\u{1F557}','\u{1F558}','\u{1F559}','\u{1F55A}','\u{1F55B}',
    '\u{1F55C}','\u{1F55D}','\u{1F55E}','\u{1F55F}','\u{1F560}','\u{1F561}',
    '\u{1F562}','\u{1F563}','\u{1F564}','\u{1F565}','\u{1F566}','\u{1F567}',
  ];

  const faceEl = document.getElementById('face');
  const readoutEl = document.getElementById('readout');

  function pad(n){ return String(n).padStart(2, '0'); }

  function render(){
    const now = new Date();
    let h = now.getHours() % 12;
    if (h === 0) h = 12;
    const m = now.getMinutes();
    const s = now.getSeconds();

    let hourIndex = h - 1;
    let half = 0;
    if (m >= 45){
      hourIndex = h % 12; // rolls to next hour, on-the-hour face
      half = 0;
    } else if (m >= 15){
      half = 12; // half-past variant
    }
    faceEl.textContent = CLOCK_EMOJI[hourIndex + half];

    const displayH = h;
    readoutEl.innerHTML = `${pad(displayH)}<span class="sep">:</span>${pad(m)}<span class="sep">:</span>${pad(s)}`;
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
