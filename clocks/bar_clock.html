<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --face:#161922;
    --track:#2a2f3b;
    --rim:#e0b975;
    --paper:#f5f2ea;
    --teal:#6fa89f;
    --dim:#8a795a;
  }
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
  }
  .panel{
    width:min(84vw, 480px);
    display:flex; flex-direction:column; gap:22px;
  }
  .row{ display:flex; align-items:center; gap:14px; }
  .label{
    width:14px;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--dim);
  }
  .track{
    flex:1;
    height:12px;
    background:var(--track);
    position:relative;
    overflow:hidden;
  }
  .fill{
    position:absolute; top:0; left:0; bottom:0;
    width:0%;
  }
  .fill::after{
    content:'';
    position:absolute; right:0; top:-3px; bottom:-3px;
    width:2px;
  }
  .row.hour .fill{ background:var(--rim); }
  .row.hour .fill::after{ background:var(--rim); }
  .row.minute .fill{ background:var(--paper); }
  .row.minute .fill::after{ background:var(--paper); }
  .row.second .fill{ background:var(--teal); }
  .row.second .fill::after{ background:var(--teal); }
  .value{
    width:32px;
    text-align:right;
    font-size:14px;
    color:var(--paper);
  }
  #tag{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="panel">
    <div class="row hour">
      <div class="label">H</div>
      <div class="track"><div class="fill" id="hourFill"></div></div>
      <div class="value" id="hourVal">00</div>
    </div>
    <div class="row minute">
      <div class="label">M</div>
      <div class="track"><div class="fill" id="minuteFill"></div></div>
      <div class="value" id="minuteVal">00</div>
    </div>
    <div class="row second">
      <div class="label">S</div>
      <div class="track"><div class="fill" id="secondFill"></div></div>
      <div class="value" id="secondVal">00</div>
    </div>
  </div>
  <div id="tag">time laid out straight</div>
</div>
<script>
  const hourFill = document.getElementById('hourFill');
  const minuteFill = document.getElementById('minuteFill');
  const secondFill = document.getElementById('secondFill');
  const hourVal = document.getElementById('hourVal');
  const minuteVal = document.getElementById('minuteVal');
  const secondVal = document.getElementById('secondVal');

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    const now = new Date();
    let h = now.getHours() % 12;
    if (h === 0) h = 12;
    const displayHour = h;
    const hourForFrac = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const hourFrac   = (hourForFrac + m / 60) / 12;
    const minuteFrac = (m + s / 60) / 60;
    const secondFrac = (s + ms / 1000) / 60;

    hourFill.style.width = (hourFrac * 100) + '%';
    minuteFill.style.width = (minuteFrac * 100) + '%';
    secondFill.style.width = (secondFrac * 100) + '%';

    hourVal.textContent = pad(displayHour);
    minuteVal.textContent = pad(m);
    secondVal.textContent = pad(s);

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
