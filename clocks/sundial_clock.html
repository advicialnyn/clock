<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sundial Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#8a795a;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="label">the shadow tells the hour</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600;
  const CX = SIZE / 2, CY = SIZE / 2;
  const R = 230;

  const COL = {
    dial: '#242a36',
    shadow: '#0a0c11',
    rim: '#e0b975',
    paper: '#f5f2ea',
    teal: '#6fa89f',
  };

  function drawDial(){
    ctx.clearRect(0, 0, SIZE, SIZE);

    // lit dial surface
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fillStyle = COL.dial;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = COL.rim;
    ctx.stroke();

    // twelve hour ticks
    ctx.save();
    ctx.translate(CX, CY);
    for (let i = 0; i < 12; i++){
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const major = i % 3 === 0;
      const inner = R - (major ? 26 : 18);
      const outer = R - 6;
      ctx.beginPath();
      ctx.moveTo(inner * Math.cos(a), inner * Math.sin(a));
      ctx.lineTo(outer * Math.cos(a), outer * Math.sin(a));
      ctx.strokeStyle = major ? COL.rim : COL.paper;
      ctx.globalAlpha = major ? 1 : 0.6;
      ctx.lineWidth = major ? 3 : 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawShadow(hourAngle){
    const halfWidth = 0.13; // radians, wedge half-width
    ctx.save();
    ctx.translate(CX, CY);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R - 14, hourAngle - halfWidth, hourAngle + halfWidth);
    ctx.closePath();
    ctx.fillStyle = COL.shadow;
    ctx.fill();
    ctx.restore();
  }

  function drawHand(angle, length, width, color){
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(length, 0);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  function drawGnomon(){
    // fixed triangular gnomon at center, pointing toward 12
    ctx.save();
    ctx.translate(CX, CY);
    ctx.beginPath();
    ctx.moveTo(0, -34);
    ctx.lineTo(-9, 6);
    ctx.lineTo(9, 6);
    ctx.closePath();
    ctx.fillStyle = COL.rim;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fillStyle = COL.rim;
    ctx.fill();
    ctx.restore();
  }

  function tick(){
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();

    const hourAngle   = ((h + m / 60) / 12) * Math.PI * 2 - Math.PI / 2;
    const minuteAngle = (m / 60) * Math.PI * 2 - Math.PI / 2;
    const secondAngle = (s / 60) * Math.PI * 2 - Math.PI / 2;

    drawDial();
    drawShadow(hourAngle);
    drawHand(minuteAngle, R - 60, 3, COL.teal);
    drawHand(secondAngle, R - 40, 1.5, COL.paper);
    drawGnomon();

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
