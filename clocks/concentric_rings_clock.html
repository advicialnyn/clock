<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentric Rings Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
  }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; }
  #label {
    position: absolute; bottom: 2%; font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase; color: #5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="label">radial temporal progress</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600, CX = SIZE / 2, CY = SIZE / 2;

  const COL = {
    face: '#161922',
    rimDim: 'rgba(90, 77, 52, 0.3)',
    brass: '#c9a15c',
    paper: '#ede8de',
    teal: '#4c7a73'
  };

  function drawRing(radius, ratio, width, color, glow) {
    // Background track
    ctx.beginPath();
    ctx.arc(CX, CY, radius, 0, Math.PI * 2);
    ctx.strokeStyle = COL.rimDim;
    ctx.lineWidth = width;
    ctx.stroke();

    // Active Arc
    if (ratio > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, radius, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function tick() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Dark dial background
    ctx.beginPath();
    ctx.arc(CX, CY, 280, 0, Math.PI * 2);
    ctx.fillStyle = COL.face;
    ctx.fill();

    const now = new Date();
    const ms = now.getMilliseconds();
    const s = (now.getSeconds() + ms / 1000) / 60;
    const m = (now.getMinutes() + s) / 60;
    const h = ((now.getHours() % 12) + m) / 12;

    // Rings
    drawRing(210, h, 14, COL.brass, true);
    drawRing(160, m, 10, COL.paper, false);
    drawRing(110, s, 6, COL.teal, true);

    // Digital readout center
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');

    ctx.font = '600 28px "IBM Plex Mono", monospace';
    ctx.fillStyle = COL.paper;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${hh}:${mm}:${ss}`, CX, CY);

    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
