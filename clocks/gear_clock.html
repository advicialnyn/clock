<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
  }
  canvas{ max-width:88%; max-height:80%; }
  #readout{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #time{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px, 5vw, 30px);
    color:#ede8de;
  }
  #caption{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="560" height="560"></canvas>
  <div id="readout">
    <div id="time">00:00:00</div>
    <div id="caption">three gears, three speeds</div>
  </div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 560;
  const CX = SIZE / 2, CY = SIZE / 2;

  const COL = {
    plate: '#161922',
    plateEdge: '#1f2330',
    hour: '#c9a15c',
    minute: '#ede8de',
    second: '#4c7a73',
    rivet: '#5a4d34',
  };

  function gearPath(cx, cy, outerR, innerR, teeth, rotation){
    ctx.beginPath();
    const step = (Math.PI * 2) / (teeth * 2);
    for (let i = 0; i <= teeth * 2; i++){
      const r = i % 2 === 0 ? outerR : innerR;
      const angle = rotation + i * step;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawGear(outerR, innerR, teeth, rotation, fillColor, holeR, rivets){
    gearPath(CX, CY, outerR, innerR, teeth, rotation);
    ctx.fillStyle = fillColor;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(22,25,34,0.5)';
    ctx.stroke();

    // punch the center hole through so nested gears underneath show
    ctx.beginPath();
    ctx.arc(CX, CY, holeR, 0, Math.PI * 2);
    ctx.fillStyle = COL.plate;
    ctx.fill();

    // decorative rivets around the mid-radius
    const ringR = (outerR + holeR) / 2;
    for (let i = 0; i < rivets; i++){
      const a = rotation + (i / rivets) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(CX + ringR * Math.cos(a), CY + ringR * Math.sin(a), 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(22,25,34,0.55)';
      ctx.fill();
    }

    // reference marker so the rotation is actually visible at a glance
    ctx.beginPath();
    ctx.moveTo(CX + (holeR + 6) * Math.cos(rotation), CY + (holeR + 6) * Math.sin(rotation));
    ctx.lineTo(CX + (outerR - 4) * Math.cos(rotation), CY + (outerR - 4) * Math.sin(rotation));
    ctx.strokeStyle = 'rgba(22,25,34,0.6)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawBackplate(){
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.beginPath();
    ctx.arc(CX, CY, 250, 0, Math.PI * 2);
    ctx.fillStyle = COL.plateEdge;
    ctx.fill();
    ctx.strokeStyle = '#5a4d34';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    const START = -Math.PI / 2;
    const hourAngle = START + (h / 12) * Math.PI * 2;
    const minuteAngle = START + (m / 60) * Math.PI * 2;
    const secondAngle = START + (s / 60) * Math.PI * 2;

    drawBackplate();

    // outermost = hour (slowest, biggest, most teeth)
    drawGear(238, 214, 40, hourAngle, COL.hour, 150, 8);
    // middle = minute
    drawGear(170, 148, 30, minuteAngle, COL.minute, 90, 6);
    // innermost = second (fastest, smallest)
    drawGear(104, 84, 20, secondAngle, COL.second, 34, 5);

    // center pinion
    ctx.beginPath();
    ctx.arc(CX, CY, 12, 0, Math.PI * 2);
    ctx.fillStyle = COL.rivet;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(CX, CY, 5, 0, Math.PI * 2);
    ctx.fillStyle = COL.plate;
    ctx.fill();

    const pad = n => String(n).padStart(2, '0');
    document.getElementById('time').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
