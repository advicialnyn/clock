<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anticlockwise Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="label">runs backwards, on purpose</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600;
  const R = SIZE / 2;

  const COL = {
    ink: '#0f1115',
    face: '#161922',
    rim: '#c9a15c',
    rimDim: '#5a4d34',
    paper: '#ede8de',
    teal: '#4c7a73',
  };

  function drawFace(){
    ctx.clearRect(0,0,SIZE,SIZE);

    // outer rim
    ctx.beginPath();
    ctx.arc(R, R, R - 6, 0, Math.PI * 2);
    ctx.strokeStyle = COL.rim;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(R, R, R - 14, 0, Math.PI * 2);
    ctx.fillStyle = COL.face;
    ctx.fill();

    // ticks — note: hour numerals are placed going counterclockwise from 12
    for (let i = 0; i < 60; i++){
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isHour = i % 5 === 0;
      const inner = isHour ? R - 46 : R - 34;
      const outer = R - 26;
      ctx.beginPath();
      ctx.moveTo(R + inner * Math.cos(angle), R + inner * Math.sin(angle));
      ctx.lineTo(R + outer * Math.cos(angle), R + outer * Math.sin(angle));
      ctx.strokeStyle = isHour ? COL.rim : COL.rimDim;
      ctx.lineWidth = isHour ? 3 : 1.5;
      ctx.stroke();
    }

    // numerals, mirrored so "1" sits where "11" normally sits, etc.
    ctx.font = '600 30px IBM Plex Mono, monospace';
    ctx.fillStyle = COL.paper;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let h = 1; h <= 12; h++){
      const mirroredHour = h === 12 ? 12 : 12 - h;
      const angle = (mirroredHour / 12) * Math.PI * 2 - Math.PI / 2;
      const radius = R - 82;
      const x = R + radius * Math.cos(angle);
      const y = R + radius * Math.sin(angle);
      ctx.fillText(String(h), x, y);
    }

    // center pin
    ctx.beginPath();
    ctx.arc(R, R, 9, 0, Math.PI * 2);
    ctx.fillStyle = COL.rim;
    ctx.fill();
  }

  function drawHand(angle, length, width, color){
    ctx.save();
    ctx.translate(R, R);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, length * 0.14);
    ctx.lineTo(0, -length);
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.stroke();
    ctx.restore();
  }

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    drawFace();

    // negate every angle to run counterclockwise
    const secAngle  = -((s / 60) * Math.PI * 2);
    const minAngle  = -((m / 60) * Math.PI * 2);
    const hourAngle = -((h / 12) * Math.PI * 2);

    drawHand(hourAngle, R * 0.46, 7, COL.paper);
    drawHand(minAngle, R * 0.68, 5, COL.paper);
    drawHand(secAngle, R * 0.74, 2, COL.teal);

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
