<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ max-width:100%; max-height:100%; }
  #label{
    position:absolute;
    bottom:2%;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5a4d34;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="clock" width="600" height="600"></canvas>
  <div id="label">no hands, only orbits</div>
</div>
<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const SIZE = 600;
  const CX = SIZE / 2, CY = SIZE / 2;

  const COL = {
    face: '#161922',
    rim: '#c9a15c',
    rimDim: '#5a4d34',
    paper: '#ede8de',
    teal: '#4c7a73',
  };

  // orbit radii and dot sizes for hour / minute / second
  const ORBITS = {
    hour:   { r: 90,  size: 9, color: COL.rim,   trail: 26 },
    minute: { r: 150, size: 7, color: COL.paper, trail: 34 },
    second: { r: 210, size: 5, color: COL.teal,  trail: 46 },
  };

  function drawFace(){
    ctx.clearRect(0, 0, SIZE, SIZE);

    ctx.save();
    ctx.translate(CX, CY);

    // faint orbit guide rings
    Object.values(ORBITS).forEach(o => {
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.strokeStyle = COL.rimDim;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // twelve faint hour ticks on the outermost ring, for reference
    for (let i = 0; i < 12; i++){
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const inner = ORBITS.second.r + 14;
      const outer = ORBITS.second.r + (i % 3 === 0 ? 26 : 20);
      ctx.beginPath();
      ctx.moveTo(inner * Math.cos(a), inner * Math.sin(a));
      ctx.lineTo(outer * Math.cos(a), outer * Math.sin(a));
      ctx.strokeStyle = COL.rimDim;
      ctx.lineWidth = i % 3 === 0 ? 2 : 1;
      ctx.stroke();
    }

    // center pin
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fillStyle = COL.rim;
    ctx.fill();

    ctx.restore();
  }

  // draws a dot plus a fading trail arc behind it along its orbit
  function drawOrbitDot(angle, orbit){
    ctx.save();
    ctx.translate(CX, CY);

    // trailing arc, faded via multiple thin strokes
    const trailRad = (orbit.trail * Math.PI) / 180;
    const steps = 18;
    for (let i = 0; i < steps; i++){
      const t = i / steps;
      const a0 = angle - trailRad * (1 - t);
      const a1 = angle - trailRad * (1 - (i + 1) / steps);
      ctx.beginPath();
      ctx.arc(0, 0, orbit.r, a0, a1);
      ctx.strokeStyle = orbit.color;
      ctx.globalAlpha = 0.35 * t;
      ctx.lineWidth = orbit.size * 0.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // the dot itself
    const x = orbit.r * Math.cos(angle);
    const y = orbit.r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, orbit.size, 0, Math.PI * 2);
    ctx.fillStyle = orbit.color;
    ctx.shadowColor = 'transparent'; // flat, no glow
    ctx.fill();

    ctx.restore();
  }

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    drawFace();

    const secAngle  = (s / 60) * Math.PI * 2 - Math.PI / 2;
    const minAngle  = (m / 60) * Math.PI * 2 - Math.PI / 2;
    const hourAngle = (h / 12) * Math.PI * 2 - Math.PI / 2;

    drawOrbitDot(hourAngle, ORBITS.hour);
    drawOrbitDot(minAngle, ORBITS.minute);
    drawOrbitDot(secAngle, ORBITS.second);

    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
