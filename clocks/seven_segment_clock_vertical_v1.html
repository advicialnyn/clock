<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Segment Clock — Vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --u: clamp(5px, 2.2vw, 9px);
    --on:#29b6f6;
    --off:rgba(255,255,255,0.07);
    --dim:#5f6b78;
  }
  html,body{
    margin:0; height:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
  }
  .stage{
    display:flex; flex-direction:column;
    gap:calc(var(--u) * 1.6);
  }
  .row{ display:flex; align-items:center; gap:calc(var(--u) * 1.6); }
  .label{
    width:calc(var(--u) * 1.6);
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--dim);
  }
  .group{ display:flex; gap:calc(var(--u) * 1.2); }
  .digit{
    position:relative;
    width:calc(var(--u) * 6);
    height:calc(var(--u) * 10);
  }
  .seg{
    position:absolute;
    background:var(--off);
    border-radius:calc(var(--u) * 0.8);
    transition:background 0.15s ease;
  }
  .seg.on{ background:var(--on); }
  .seg.a{ top:0;                          left:var(--u);    width:calc(var(--u)*2.8); height:calc(var(--u)*1.6); }
  .seg.g{ top:calc(var(--u)*4.2);         left:var(--u);    width:calc(var(--u)*2.8); height:calc(var(--u)*1.6); }
  .seg.d{ top:calc(var(--u)*8.4);         left:var(--u);    width:calc(var(--u)*2.8); height:calc(var(--u)*1.6); }
  .seg.f{ top:calc(var(--u)*1.6);         left:0;           width:calc(var(--u)*1.6); height:calc(var(--u)*2.6); }
  .seg.b{ top:calc(var(--u)*1.6);         left:calc(var(--u)*4.4); width:calc(var(--u)*1.6); height:calc(var(--u)*2.6); }
  .seg.e{ top:calc(var(--u)*5.8);         left:0;           width:calc(var(--u)*1.6); height:calc(var(--u)*2.6); }
  .seg.c{ top:calc(var(--u)*5.8);         left:calc(var(--u)*4.4); width:calc(var(--u)*1.6); height:calc(var(--u)*2.6); }

  #tag{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="stage" id="stage"></div>
  <div id="tag">seven segments, stacked</div>
</div>
<script>
  const SEGMENTS = {
    '0': ['a','b','c','d','e','f'],
    '1': ['b','c'],
    '2': ['a','b','g','e','d'],
    '3': ['a','b','g','c','d'],
    '4': ['f','g','b','c'],
    '5': ['a','f','g','c','d'],
    '6': ['a','f','g','e','c','d'],
    '7': ['a','b','c'],
    '8': ['a','b','c','d','e','f','g'],
    '9': ['a','b','c','d','f','g'],
  };
  const SEG_NAMES = ['a','b','c','d','e','f','g'];

  const stage = document.getElementById('stage');

  function makeDigit(id){
    const d = document.createElement('div');
    d.className = 'digit';
    d.id = id;
    SEG_NAMES.forEach(name => {
      const s = document.createElement('div');
      s.className = 'seg ' + name;
      s.dataset.name = name;
      d.appendChild(s);
    });
    return d;
  }

  function makeRow(prefix, label){
    const row = document.createElement('div');
    row.className = 'row';
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = label;
    const group = document.createElement('div');
    group.className = 'group';
    group.appendChild(makeDigit(prefix + '0'));
    group.appendChild(makeDigit(prefix + '1'));
    row.appendChild(l);
    row.appendChild(group);
    return row;
  }

  stage.appendChild(makeRow('h', 'H'));
  stage.appendChild(makeRow('m', 'M'));
  stage.appendChild(makeRow('s', 'S'));

  function setDigit(id, char){
    const active = SEGMENTS[char] || [];
    const el = document.getElementById(id);
    el.querySelectorAll('.seg').forEach(seg => {
      seg.classList.toggle('on', active.includes(seg.dataset.name));
    });
  }

  function pad(n){ return String(n).padStart(2, '0'); }

  function render(){
    const now = new Date();
    let h = now.getHours() % 12;
    if (h === 0) h = 12;
    const hh = pad(h);
    const mm = pad(now.getMinutes());
    const ss = pad(now.getSeconds());

    setDigit('h0', hh[0]);
    setDigit('h1', hh[1]);
    setDigit('m0', mm[0]);
    setDigit('m1', mm[1]);
    setDigit('s0', ss[0]);
    setDigit('s1', ss[1]);
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
