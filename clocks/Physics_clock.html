<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Physics Clock</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,sans-serif;
}

.clock{
  width:min(82vw,520px);
  aspect-ratio:1;
  position:relative;
  margin:auto;

  border-radius:50%;

  background:
    radial-gradient(
      circle at center,
      #20252b 0%,
      #101318 58%,
      #080a0d 100%
    );

  border:2px solid #806b43;

  box-shadow:
    0 0 0 8px #11151a,
    0 0 0 10px #4c412d,
    inset 0 0 45px rgba(0,0,0,.9),
    0 0 40px rgba(0,0,0,.8);
}


/* Scientific rings */

.ring{
  position:absolute;
  inset:8%;
  border-radius:50%;
  border:1px solid rgba(201,161,92,.18);
}

.ring.two{
  inset:17%;
  border-style:dashed;
  border-color:rgba(76,122,115,.22);
}

.ring.three{
  inset:27%;
  border-color:rgba(201,161,92,.12);
}


/* Physics symbols */

.symbol{
  position:absolute;

  transform:translate(-50%,-50%);

  color:#c9a15c;

  font-size:clamp(11px,2.5vw,18px);

  font-weight:500;

  text-shadow:
    0 0 8px rgba(201,161,92,.25);

  white-space:nowrap;
}


/* positions */

.s12{
  left:50%;
  top:7%;
}

.s1{
  left:72%;
  top:13%;
}

.s2{
  left:87%;
  top:28%;
}

.s3{
  left:93%;
  top:50%;
}

.s4{
  left:87%;
  top:72%;
}

.s5{
  left:72%;
  top:87%;
}

.s6{
  left:50%;
  top:93%;
}

.s7{
  left:28%;
  top:87%;
}

.s8{
  left:13%;
  top:72%;
}

.s9{
  left:7%;
  top:50%;
}

.s10{
  left:13%;
  top:28%;
}

.s11{
  left:28%;
  top:13%;
}


/* Tick marks */

.tick-container{
  position:absolute;
  inset:3%;
  border-radius:50%;
}

.tick{
  position:absolute;

  left:50%;
  top:50%;

  width:1px;
  height:4%;

  background:#625438;

  transform-origin:
    50% calc(50% + 470%);

  transform:
    translate(-50%,-50%)
    rotate(var(--angle));
}

.tick.major{
  width:2px;
  height:6%;

  background:#a78a52;
}


/* Center */

.center{
  position:absolute;

  left:50%;
  top:50%;

  width:14px;
  height:14px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#c9a15c;

  box-shadow:
    0 0 12px rgba(201,161,92,.5);

  z-index:10;
}


/* Hands */

.hand{
  position:absolute;

  left:50%;
  top:50%;

  transform-origin:
    50% 100%;

  transform:
    translate(-50%,-100%)
    rotate(0deg);

  border-radius:4px 4px 1px 1px;

  z-index:5;
}

.hour{
  width:7px;
  height:25%;

  background:#d7c9a8;
}

.minute{
  width:5px;
  height:35%;

  background:#c9a15c;
}

.second{
  width:2px;
  height:39%;

  background:#4c7a73;

  box-shadow:
    0 0 7px rgba(76,122,115,.6);
}


/* Counterweight */

.second::after{
  content:"";

  position:absolute;

  width:2px;
  height:18%;

  left:0;
  bottom:-18%;

  background:#4c7a73;
}


/* Equation panel */

.equation{
  position:absolute;

  left:50%;
  top:64%;

  transform:translateX(-50%);

  color:#6d777a;

  font-size:clamp(8px,1.8vw,12px);

  letter-spacing:.12em;

  white-space:nowrap;
}


/* Digital physics readout */

.readout{
  position:absolute;

  left:50%;
  top:76%;

  transform:translateX(-50%);

  color:#8c9a97;

  font-family:monospace;

  font-size:clamp(7px,1.5vw,10px);

  letter-spacing:.08em;

  white-space:nowrap;

  opacity:.65;
}


/* Small orbital dots */

.orbit{
  position:absolute;

  inset:34%;

  border-radius:50%;

  border:1px solid rgba(76,122,115,.16);

  transform:rotate(-20deg);
}

.orbit::before{
  content:"";

  position:absolute;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#4c7a73;

  box-shadow:0 0 10px #4c7a73;

  top:-4px;
  left:50%;
}


/* Responsive */

@media(max-width:400px){

  .clock{
    width:88vw;
  }

}
</style>
</head>

<body>

<div class="clock">

  <!-- Scientific rings -->
  <div class="ring"></div>
  <div class="ring two"></div>
  <div class="ring three"></div>

  <!-- Orbital ring -->
  <div class="orbit"></div>


  <!-- Physics symbols -->

  <div class="symbol s12">E = mc²</div>
  <div class="symbol s1">λ</div>
  <div class="symbol s2">F = ma</div>
  <div class="symbol s3">c</div>
  <div class="symbol s4">Δt</div>
  <div class="symbol s5">Ω</div>
  <div class="symbol s6">g</div>
  <div class="symbol s7">π</div>
  <div class="symbol s8">γ</div>
  <div class="symbol s9">α</div>
  <div class="symbol s10">h</div>
  <div class="symbol s11">β</div>


  <!-- Tick marks -->

  <div class="tick-container" id="ticks"></div>


  <!-- Clock hands -->

  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>

  <div class="center"></div>


  <!-- Physics readouts -->

  <div class="equation">
    Δx · Δp ≥ ℏ / 2
  </div>

  <div class="readout" id="readout">
    t = 00:00:00
  </div>

</div>


<script>

/* ==========================================
   CREATE CLOCK TICKS
   ========================================== */

const ticks =
  document.getElementById("ticks");

for(let i=0;i<60;i++){

  const tick =
    document.createElement("div");

  tick.className =
    "tick";

  if(i % 5 === 0){
    tick.classList.add("major");
  }

  tick.style.setProperty(
    "--angle",
    `${i * 6}deg`
  );

  ticks.appendChild(tick);
}


/* ==========================================
   CLOCK
   ========================================== */

const hour =
  document.getElementById("hour");

const minute =
  document.getElementById("minute");

const second =
  document.getElementById("second");

const readout =
  document.getElementById("readout");


function updateClock(){

  const now =
    new Date();

  const h =
    now.getHours() % 12;

  const m =
    now.getMinutes();

  const s =
    now.getSeconds();

  const ms =
    now.getMilliseconds();


  /*
   * Smooth second hand
   */

  const secondValue =
    s + ms / 1000;


  /*
   * Minute hand
   */

  const minuteValue =
    m + secondValue / 60;


  /*
   * Hour hand
   */

  const hourValue =
    h + minuteValue / 60;


  hour.style.transform =
    `translate(-50%,-100%)
     rotate(${hourValue * 30}deg)`;


  minute.style.transform =
    `translate(-50%,-100%)
     rotate(${minuteValue * 6}deg)`;


  second.style.transform =
    `translate(-50%,-100%)
     rotate(${secondValue * 6}deg)`;


  /*
   * Physics-style digital readout
   */

  const hh =
    String(now.getHours())
      .padStart(2,"0");

  const mm =
    String(m)
      .padStart(2,"0");

  const ss =
    String(s)
      .padStart(2,"0");


  readout.textContent =
    `t = ${hh}:${mm}:${ss}`;

}


updateClock();

setInterval(
  updateClock,
  50
);

</script>

</body>
</html>
