<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Timepieces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0f1115;
    --ink-2:#161922;
    --paper:#ede8de;
    --brass:#c9a15c;
    --brass-dim:#5a4d34;
    --teal:#4c7a73;
    --grey:#6b6f76;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
  }

  /* ---- header ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 26px 0;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--grey);
    z-index:5;
  }

  header .mark{ color:var(--brass); }
  header .count{ color:var(--paper); opacity:0.7; }

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(22px, 4vw, 34px);
    text-align:center;
    margin:2px 0 0;
    letter-spacing:0.01em;
    color:var(--paper);
    z-index:5;
  }

  /* ---- alphabetical category tabs ---- */
  #categoryTabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    white-space:nowrap;
    padding:10px 26px 4px;
    scrollbar-width:none;
    z-index:5;
  }

  #categoryTabs::-webkit-scrollbar{
    display:none;
  }

  .category-tab{
    flex:0 0 auto;
    background:none;
    border:1px solid var(--brass-dim);
    color:var(--grey);
    padding:6px 10px;
    font-family:inherit;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;

    transition:
      color 0.2s ease,
      border-color 0.2s ease,
      background 0.2s ease;
  }

  .category-tab:hover{
    color:var(--paper);
    border-color:var(--brass);
  }

  .category-tab.active{
    color:var(--ink);
    background:var(--brass);
    border-color:var(--brass);
  }

  /* ---- track / viewport ---- */
  #viewport{
    position:relative;
    flex:1;
    overflow:hidden;
    perspective:1400px;
  }

  #track{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    display:flex;
    will-change:transform;
    touch-action:pan-y;
  }

  .pane{
    position:relative;
    height:100%;
    width:100vw;
    flex:0 0 100vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pane iframe{
    width:min(92vw, 560px);
    height:min(72vh, 560px);
    border:0;
    background:transparent;
    pointer-events:none;
  }

  /* ---- bezel indicator ---- */
  #bezel{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    padding:10px 0 8px;
    z-index:5;
  }

  .tick{
    width:2px;
    height:14px;
    background:var(--brass-dim);
    border-radius:1px;

    transition:
      height 0.25s ease,
      background 0.25s ease,
      transform 0.25s ease;
  }

  .tick.active{
    height:22px;
    background:var(--brass);
    transform:scaleX(2);
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 26px 22px;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--grey);
    z-index:5;
  }

  footer .hint{
    transition:opacity 0.6s ease;
  }

  footer .hint.faded{
    opacity:0.25;
  }

  /* ---- navigation buttons ---- */
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:1px solid var(--brass-dim);
    color:var(--brass);
    width:38px;
    height:38px;
    border-radius:50%;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:6;
    opacity:0.55;

    transition:
      opacity 0.2s ease,
      border-color 0.2s ease;
  }

  .nav-btn:hover{
    opacity:1;
    border-color:var(--brass);
  }

  .nav-btn:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }

  #prevBtn{ left:16px; }
  #nextBtn{ right:16px; }

  @media (max-width:640px){
    .nav-btn{
      display:none;
    }
  }

  @media (prefers-reduced-motion: reduce){
    #track{
      transition:none !important;
    }

    .tick{
      transition:none !important;
    }
  }
</style>
</head>

<body>

<div id="app">

  <header>
    <span>
      <span class="mark">&#9679;</span> TIMEPIECES
    </span>

    <span class="count" id="count">
      01 / 02
    </span>
  </header>

  <h1 class="title" id="title">
    Anticlockwise
  </h1>

  <!-- Alphabetical clock tabs -->
  <div id="categoryTabs"></div>

  <div id="viewport">

    <button
      class="nav-btn"
      id="prevBtn"
      aria-label="Previous clock">
      &#8249;
    </button>

    <div id="track"></div>

    <button
      class="nav-btn"
      id="nextBtn"
      aria-label="Next clock">
      &#8250;
    </button>

  </div>

  <div id="bezel"></div>

  <footer>
    <span class="hint" id="hint">
      swipe, drag, or use &#8592; &#8594;
    </span>

    <span id="pathLabel">
      /clocks/anticlockwise_clock.html
    </span>
  </footer>

</div>


<script>

  /* =========================================================
     FALLBACK CLOCK LIST
     ========================================================= */

  const FALLBACK_CLOCKS = [
    {
      name: "Anticlockwise",
      path: "clocks/anticlockwise_clock.html"
    },
    {
      name: "Rectangular",
      path: "clocks/rectangular_clock.html"
    },
  ];


  /* =========================================================
     FILE NAME -> TITLE
     ========================================================= */

  function toTitle(filename){

    return filename
      .replace(/\.html?$/i, '')
      .replace(/[_-]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());

  }


  /* =========================================================
     DETECT GITHUB REPOSITORY
     ========================================================= */

  function detectRepo(){

    const host = window.location.hostname;

    if(!host.endsWith('.github.io'))
      return null;

    const owner = host.replace('.github.io', '');

    const parts =
      window.location.pathname
        .split('/')
        .filter(Boolean);

    const repo =
      parts.length > 0
        ? parts[0]
        : (owner + '.github.io');

    return {
      owner,
      repo
    };

  }


  /* =========================================================
     DISCOVER CLOCKS
     ========================================================= */

  async function discoverClocks(){

    const repoInfo = detectRepo();

    if(!repoInfo)
      return FALLBACK_CLOCKS;

    try{

      const res = await fetch(
        `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/clocks`
      );

      if(!res.ok)
        throw new Error(
          'GitHub API error ' + res.status
        );

      const files = await res.json();

      const clocks = files
        .filter(
          f =>
            f.type === 'file' &&
            /\.html?$/i.test(f.name)
        )
        .sort(
          (a,b) =>
            a.name.localeCompare(
              b.name,
              undefined,
              {
                sensitivity:'base'
              }
            )
        )
        .map(
          f => ({
            name:toTitle(f.name),
            path:'clocks/' + f.name
          })
        );

      return clocks.length
        ? clocks
        : FALLBACK_CLOCKS;

    }catch(err){

      console.warn(
        'Clock auto-discovery failed, using fallback list:',
        err
      );

      return FALLBACK_CLOCKS;
    }

  }


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const track =
    document.getElementById('track');

  const bezel =
    document.getElementById('bezel');

  const titleEl =
    document.getElementById('title');

  const countEl =
    document.getElementById('count');

  const pathLabel =
    document.getElementById('pathLabel');

  const hint =
    document.getElementById('hint');

  const prevBtn =
    document.getElementById('prevBtn');

  const nextBtn =
    document.getElementById('nextBtn');

  const categoryTabs =
    document.getElementById('categoryTabs');


  /* =========================================================
     STATE
     ========================================================= */

  let CLOCKS = [];

  let current = 0;

  let viewportWidth =
    window.innerWidth;

  let dragging = false;

  let dragStartX = 0;

  let dragDeltaX = 0;

  let hasInteracted = false;


  /* =========================================================
     CREATE EMPTY PANES
     
     IMPORTANT:
     We create panes for positioning,
     BUT ONLY 3 IFRAMES WILL EXIST.
     ========================================================= */

  function buildPanes(){

    track.innerHTML = '';

    bezel.innerHTML = '';

    categoryTabs.innerHTML = '';


    CLOCKS.forEach((clock, i) => {

      /* -------------------------
         Empty pane
         ------------------------- */

      const pane =
        document.createElement('div');

      pane.className = 'pane';

      pane.dataset.index = i;

      track.appendChild(pane);


      /* -------------------------
         Bezel tick
         ------------------------- */

      const tick =
        document.createElement('div');

      tick.className =
        'tick' +
        (i === 0 ? ' active' : '');

      bezel.appendChild(tick);


      /* -------------------------
         Category tab
         ------------------------- */

      const tab =
        document.createElement('button');

      tab.className =
        'category-tab' +
        (i === 0 ? ' active' : '');

      tab.textContent =
        clock.name;

      tab.type = 'button';


      tab.addEventListener(
        'click',
        () => {

          goTo(i);

        }
      );


      categoryTabs.appendChild(tab);

    });


    /*
     * Load only the current clock,
     * plus one on either side.
     */

    updateLoadedClocks();

  }


  /* =========================================================
     CREATE ONE IFRAME
     ========================================================= */

  function createIframe(index){

    if(index < 0 || index >= CLOCKS.length)
      return;


    const pane =
      track.children[index];

    if(!pane)
      return;


    /* Already loaded */
    if(pane.querySelector('iframe'))
      return;


    const clock =
      CLOCKS[index];


    const iframe =
      document.createElement('iframe');


    iframe.src =
      clock.path;


    iframe.title =
      clock.name + ' clock';


    iframe.loading = 'eager';


    iframe.setAttribute(
      'aria-label',
      clock.name + ' clock'
    );


    pane.appendChild(iframe);

  }


  /* =========================================================
     REMOVE ONE IFRAME
     ========================================================= */

  function removeIframe(index){

    if(index < 0 || index >= CLOCKS.length)
      return;


    const pane =
      track.children[index];


    if(!pane)
      return;


    const iframe =
      pane.querySelector('iframe');


    if(iframe){

      /*
       * Removing the iframe completely
       * destroys its document and JavaScript.
       */

      iframe.src = 'about:blank';

      iframe.remove();

    }

  }


  /* =========================================================
     KEEP ONLY:
     
       previous
       current
       next
     
     LOADED
     ========================================================= */

  function updateLoadedClocks(){

    if(!CLOCKS.length)
      return;


    const allowed = new Set();


    /* Previous */
    if(current - 1 >= 0)
      allowed.add(current - 1);


    /* Current */
    allowed.add(current);


    /* Next */
    if(current + 1 < CLOCKS.length)
      allowed.add(current + 1);


    /*
     * Remove every iframe that is
     * outside the 3-clock window.
     */

    for(let i = 0; i < CLOCKS.length; i++){

      if(allowed.has(i)){

        createIframe(i);

      }else{

        removeIframe(i);

      }

    }

  }


  /* =========================================================
     UPDATE HEADER / TABS / INDICATORS
     ========================================================= */

  function updateChrome(){

    if(!CLOCKS[current])
      return;


    titleEl.textContent =
      CLOCKS[current].name;


    pathLabel.textContent =
      '/' + CLOCKS[current].path;


    countEl.textContent =
      String(current + 1).padStart(2,'0') +
      ' / ' +
      String(CLOCKS.length).padStart(2,'0');


    /* Bezel */

    [...bezel.children].forEach(
      (tick, i) => {

        tick.classList.toggle(
          'active',
          i === current
        );

      }
    );


    /* Category tabs */

    [...categoryTabs.children].forEach(
      (tab, i) => {

        tab.classList.toggle(
          'active',
          i === current
        );

      }
    );


    /* Keep active tab visible */

    const activeTab =
      categoryTabs.children[current];


    if(activeTab){

      activeTab.scrollIntoView({
        behavior:'smooth',
        block:'nearest',
        inline:'center'
      });

    }


    /* Navigation buttons */

    prevBtn.style.visibility =
      current === 0
        ? 'hidden'
        : 'visible';


    nextBtn.style.visibility =
      current === CLOCKS.length - 1
        ? 'hidden'
        : 'visible';

  }


  /* =========================================================
     GO TO CLOCK
     ========================================================= */

  function goTo(
    index,
    animate = true
  ){

    current =
      Math.max(
        0,
        Math.min(
          CLOCKS.length - 1,
          index
        )
      );


    track.style.transition =
      animate
        ? 'transform 0.42s cubic-bezier(.22,.61,.36,1)'
        : 'none';


    track.style.transform =
      `translateX(${-current * viewportWidth}px)`;


    /*
     * IMPORTANT:
     * Update the iframe window whenever
     * the current clock changes.
     */

    updateLoadedClocks();


    updateChrome();


    markInteracted();

  }


  /* =========================================================
     INTERACTION HINT
     ========================================================= */

  function markInteracted(){

    if(hasInteracted)
      return;


    hasInteracted = true;

    hint.classList.add('faded');

  }


  /* =========================================================
     RESIZE
     ========================================================= */

  window.addEventListener(
    'resize',
    () => {

      viewportWidth =
        window.innerWidth;

      goTo(
        current,
        false
      );

    }
  );


  /* =========================================================
     BUTTONS
     ========================================================= */

  prevBtn.addEventListener(
    'click',
    () => {

      goTo(current - 1);

    }
  );


  nextBtn.addEventListener(
    'click',
    () => {

      goTo(current + 1);

    }
  );


  /* =========================================================
     KEYBOARD
     ========================================================= */

  window.addEventListener(
    'keydown',
    (e) => {

      if(e.key === 'ArrowRight'){

        goTo(current + 1);

      }


      if(e.key === 'ArrowLeft'){

        goTo(current - 1);

      }

    }
  );


  /* =========================================================
     SWIPE / DRAG
     ========================================================= */

  const viewportEl =
    document.getElementById('viewport');


  function onStart(x){

    dragging = true;

    dragStartX = x;

    dragDeltaX = 0;

    track.style.transition =
      'none';

    markInteracted();

  }


  function onMove(x){

    if(!dragging)
      return;


    dragDeltaX =
      x - dragStartX;


    /* Resist at ends */

    let resist = 1;


    if(
      (current === 0 &&
       dragDeltaX > 0) ||

      (current === CLOCKS.length - 1 &&
       dragDeltaX < 0)
    ){

      resist = 0.35;

    }


    const offset =
      -current * viewportWidth +
      dragDeltaX * resist;


    track.style.transform =
      `translateX(${offset}px)`;

  }


  function onEnd(){

    if(!dragging)
      return;


    dragging = false;


    const threshold =
      viewportWidth * 0.16;


    if(
      dragDeltaX <= -threshold
    ){

      goTo(current + 1);

    }

    else if(
      dragDeltaX >= threshold
    ){

      goTo(current - 1);

    }

    else{

      goTo(current);

    }

  }


  /* =========================================================
     TOUCH
     ========================================================= */

  viewportEl.addEventListener(
    'touchstart',
    (e) => {

      onStart(
        e.touches[0].clientX
      );

    },
    {
      passive:true
    }
  );


  viewportEl.addEventListener(
    'touchmove',
    (e) => {

      onMove(
        e.touches[0].clientX
      );

    },
    {
      passive:true
    }
  );


  viewportEl.addEventListener(
    'touchend',
    onEnd
  );


  /* =========================================================
     MOUSE
     ========================================================= */

  let mouseDown = false;


  viewportEl.addEventListener(
    'mousedown',
    (e) => {

      mouseDown = true;

      onStart(
        e.clientX
      );

    }
  );


  window.addEventListener(
    'mousemove',
    (e) => {

      if(mouseDown){

        onMove(
          e.clientX
        );

      }

    }
  );


  window.addEventListener(
    'mouseup',
    () => {

      if(mouseDown){

        mouseDown = false;

        onEnd();

      }

    }
  );


  /* =========================================================
     INITIALIZE
     ========================================================= */

  (async function init(){

    CLOCKS =
      await discoverClocks();


    /*
     * Alphabetical order
     */

    CLOCKS.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          {
            sensitivity:'base'
          }
        )
    );


    buildPanes();


    goTo(
      0,
      false
    );

  })();

</script>

</body>
</html>
